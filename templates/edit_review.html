{% extends "base.html" %}
{% block title %}編輯紀錄 — {{ review.restaurant_name }}{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 620px;">
  <h1 class="form-title">編輯紀錄 ✏️</h1>
  <p class="form-subtitle">修改「{{ review.restaurant_name }}」的用餐紀錄</p>

  <form action="{{ url_for('edit_review', id=review.id) }}" method="POST" novalidate>

    <div class="form-group">
      <label for="restaurant_name">餐廳名稱 <span class="required">*</span></label>
      <input
        type="text"
        id="restaurant_name"
        name="restaurant_name"
        class="form-control"
        value="{{ review.restaurant_name }}"
        required
      >
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="visit_date">用餐日期 <span class="required">*</span></label>
        <input
          type="date"
          id="visit_date"
          name="visit_date"
          class="form-control"
          value="{{ review.visit_date.strftime('%Y-%m-%d') if review.visit_date else '' }}"
          required
        >
      </div>

      <div class="form-group">
        <label for="meal_type">餐別</label>
        <select id="meal_type" name="meal_type" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for mt in meal_types %}
            <option value="{{ mt }}" {% if review.meal_type == mt %}selected{% endif %}>{{ mt }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="category">料理類別</label>
        <select id="category" name="category" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for cat in categories %}
            <option value="{{ cat }}" {% if review.category == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="rating">評分（1–5 顆星）</label>
        <select id="rating" name="rating" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for i in range(1, 6) %}
            <option value="{{ i }}" {% if review.rating == i %}selected{% endif %}>
              {{ '★' * i }}{{ '☆' * (5 - i) }} {{ i }} 星
            </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="price">消費金額（NT$）</label>
      <input
        type="number"
        id="price"
        name="price"
        class="form-control"
        placeholder="可留空"
        min="0"
        step="1"
        value="{{ review.price | int if review.price is not none else '' }}"
      >
    </div>

    <div class="form-group">
      <label for="address">地址</label>
      <input
        type="text"
        id="address"
        name="address"
        class="form-control"
        value="{{ review.address or '' }}"
      >
    </div>

    <div class="form-group">
      <label for="comment">心得評論</label>
      <textarea
        id="comment"
        name="comment"
        class="form-control"
        rows="4"
      >{{ review.comment or '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">儲存變更</button>
      <a href="{{ url_for('diary') }}" class="btn btn-secondary">取消</a>
    </div>

  </form>
</div>
{% endblock %}
