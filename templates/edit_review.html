{% extends "base.html" %}
{% block title %}編輯紀錄 — {{ review.restaurant_name }}{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 620px;">
  <h1 class="form-title">編輯紀錄 ✏️</h1>
  <p class="form-subtitle">修改「{{ review.restaurant_name }}」的用餐紀錄</p>

  <form action="{{ url_for('edit_review', id=review.id) }}" method="POST" novalidate>

    <div class="form-group">
      <label for="restaurant_name">餐廳名稱 <span class="required">*</span></label>
      <input type="text" id="restaurant_name" name="restaurant_name" class="form-control"
        value="{{ review.restaurant_name }}" list="restaurant-list" autocomplete="off" required>
      {% if restaurant_names %}
        <datalist id="restaurant-list">
          {% for name in restaurant_names %}<option value="{{ name }}">{% endfor %}
        </datalist>
      {% else %}
        <datalist id="restaurant-list"></datalist>
      {% endif %}
    </div>

    <!-- 選擇菜色與數量 -->
    <div id="menu-container" class="form-group" style="display:none;">
      <label>選擇菜色與數量 <span class="form-hint" style="font-weight:400;">（每道菜選擇後會自動新增一組輸入欄位，最後一組可留空）</span></label>
      <div id="dish-rows"></div>
      <p class="form-hint" style="margin-top:0.25rem;">熱量與蛋白質會同步顯示所有已選菜色的數量總和。</p>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="visit_date">用餐日期 <span class="required">*</span></label>
        <input type="date" id="visit_date" name="visit_date" class="form-control"
          value="{{ review.visit_date.strftime('%Y-%m-%d') if review.visit_date else '' }}" required>
      </div>
      <div class="form-group">
        <label for="meal_type">餐別</label>
        <select id="meal_type" name="meal_type" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for mt in meal_types %}
            <option value="{{ mt }}" {% if review.meal_type == mt %}selected{% endif %}>{{ mt }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="category">料理類別</label>
        <select id="category" name="category" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for cat in categories %}
            <option value="{{ cat }}" {% if review.category == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="rating">評分（1–5 顆星）</label>
        <select id="rating" name="rating" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for i in range(1, 6) %}
            <option value="{{ i }}" {% if review.rating == i %}selected{% endif %}>
              {{ '★' * i }}{{ '☆' * (5 - i) }} {{ i }} 星
            </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="price">消費金額（NT$）</label>
      <input type="number" id="price" name="price" class="form-control"
        placeholder="可留空" min="0" step="1"
        value="{{ review.price | int if review.price is not none else '' }}">
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="calories">熱量（kcal）</label>
        <input type="number" id="calories" name="calories" class="form-control"
          placeholder="可留空" min="0" step="1"
          value="{{ review.calories | int if review.calories is not none else '' }}">
      </div>
      <div class="form-group">
        <label for="protein">蛋白質（g）</label>
        <input type="number" id="protein" name="protein" class="form-control"
          placeholder="可留空" min="0" step="0.1"
          value="{{ review.protein if review.protein is not none else '' }}">
      </div>
    </div>

    <div class="form-group">
      <label for="address">地址</label>
      <input type="text" id="address" name="address" class="form-control"
        value="{{ review.address or '' }}">
    </div>

    <div class="form-group">
      <label for="comment">心得評論</label>
      <textarea id="comment" name="comment" class="form-control" rows="4">{{ review.comment or '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">儲存變更</button>
      <a href="{{ url_for('diary') }}" class="btn btn-secondary">取消</a>
    </div>

  </form>
</div>

<script>
(function () {
  const input      = document.getElementById('restaurant_name');
  const list       = document.getElementById('restaurant-list');
  const menuBox    = document.getElementById('menu-container');
  const dishRows   = document.getElementById('dish-rows');
  const priceInput = document.getElementById('price');
  const calInput   = document.getElementById('calories');
  const proInput   = document.getElementById('protein');
  const addrInput  = document.getElementById('address');

  let availableMenuItems = [];

  function createOption(item) {
    const opt = document.createElement('option');
    opt.value = item.item_name || '';
    opt.textContent = item.item_name + (item.price != null ? '（NT$' + item.price + '）' : '');
    if (item.price != null)    opt.dataset.price    = item.price;
    if (item.calories != null) opt.dataset.calories = item.calories;
    if (item.protein != null)  opt.dataset.protein  = item.protein;
    return opt;
  }

  function populateSelect(select) {
    select.innerHTML = '<option value="">-- 選擇菜色 --</option>';
    availableMenuItems.forEach(item => select.appendChild(createOption(item)));
  }

  function addDishRow(selected = '', qty = 1) {
    const row = document.createElement('div');
    row.className = 'dish-row';
    row.style = 'display:flex; gap:0.75rem; align-items:flex-end; margin-bottom:0.75rem;';

    const selectWrapper = document.createElement('div');
    selectWrapper.style = 'flex:1;';
    const select = document.createElement('select');
    select.className = 'form-control dish-select';
    select.name = 'dish_item';
    select.style.width = '100%';
    populateSelect(select);
    select.value = selected;
    select.addEventListener('change', handleDishRowChange);
    selectWrapper.appendChild(select);

    const qtyWrapper = document.createElement('div');
    qtyWrapper.style = 'width:110px;';
    const qtyInput = document.createElement('input');
    qtyInput.type = 'number';
    qtyInput.className = 'form-control dish-qty';
    qtyInput.name = 'dish_qty';
    qtyInput.min = '1';
    qtyInput.step = '1';
    qtyInput.value = qty > 0 ? qty : 1;
    qtyInput.addEventListener('input', handleDishRowChange);
    qtyWrapper.appendChild(qtyInput);

    row.appendChild(selectWrapper);
    row.appendChild(qtyWrapper);
    dishRows.appendChild(row);
  }

  function clearDishRows() {
    dishRows.innerHTML = '';
  }

  function normalizeDishRows() {
    const rows = Array.from(dishRows.querySelectorAll('.dish-row'));
    if (!rows.length) { addDishRow(); return; }

    rows.slice(0, -1).forEach(row => {
      const select = row.querySelector('.dish-select');
      if (select && select.value === '') row.remove();
    });

    const lastRow = dishRows.querySelector('.dish-row:last-child');
    if (lastRow) {
      const select = lastRow.querySelector('.dish-select');
      if (select && select.value !== '') addDishRow();
    }
  }

  function computeTotals() {
    let totalPrice = 0, totalCalories = 0, totalProtein = 0;

    dishRows.querySelectorAll('.dish-row').forEach(row => {
      const select = row.querySelector('.dish-select');
      const qtyInput = row.querySelector('.dish-qty');
      const qty = Math.max(1, parseInt(qtyInput.value, 10) || 0);

      if (select && select.value && qty > 0) {
        const opt = select.options[select.selectedIndex];
        totalPrice    += (parseFloat(opt.dataset.price)    || 0) * qty;
        totalCalories += (parseFloat(opt.dataset.calories) || 0) * qty;
        totalProtein  += (parseFloat(opt.dataset.protein)  || 0) * qty;
      }
    });

    priceInput.value = totalPrice    ? Math.round(totalPrice)        : '';
    calInput.value   = totalCalories ? Math.round(totalCalories)     : '';
    proInput.value   = totalProtein  ? totalProtein.toFixed(1)       : '';
  }

  function handleDishRowChange(event) {
    const target = event.target;
    if (target.classList.contains('dish-qty')) {
      const cleaned = target.value.replace(/\D/g, '');
      target.value = cleaned ? Math.max(1, Number(cleaned)) : '';
    }
    normalizeDishRows();
    computeTotals();
  }

  function loadMenu(name) {
    if (!name) {
      menuBox.style.display = 'none';
      availableMenuItems = [];
      clearDishRows();
      return;
    }
    fetch('/api/menu?restaurant=' + encodeURIComponent(name))
      .then(r => r.ok ? r.json() : {address: null, items: []})
      .then(data => {
        if (data.address && addrInput && !addrInput.value) {
          addrInput.value = data.address;
        }
        availableMenuItems = Array.isArray(data.items) ? data.items : [];
        if (!availableMenuItems.length) {
          menuBox.style.display = 'none';
          clearDishRows();
          return;
        }
        clearDishRows();
        addDishRow();
        menuBox.style.display = 'block';
        computeTotals();
      })
      .catch(() => {
        menuBox.style.display = 'none';
        availableMenuItems = [];
        clearDishRows();
      });
  }

  function checkExact() {
    const opts = Array.from(list.options).map(o => o.value);
    if (opts.includes(input.value)) loadMenu(input.value);
    else {
      menuBox.style.display = 'none';
      availableMenuItems = [];
      clearDishRows();
    }
  }

  input.addEventListener('change', checkExact);
  input.addEventListener('input',  checkExact);
})();
</script>
{% endblock %}
