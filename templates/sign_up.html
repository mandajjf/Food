{% extends "base.html" %}
{% block title %}註冊{% endblock %}

{% block content %}
<div class="form-card">
  <h1 class="form-title">建立帳號 🍽️</h1>
  <p class="form-subtitle">加入回味無窮，開始記錄你的美食故事</p>

  <form action="{{ url_for('sign_up') }}" method="POST" novalidate>

    <div class="form-group">
      <label for="username">使用者名稱 <span class="required">*</span></label>
      <input
        type="text"
        id="username"
        name="username"
        class="form-control"
        placeholder="設定你的帳號名稱"
        value="{{ username | default('') }}"
        autocomplete="username"
        required
      >
    </div>

    <div class="form-group">
      <label for="email">Email <span class="required">*</span></label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        placeholder="your@email.com"
        value="{{ email | default('') }}"
        autocomplete="email"
        required
      >
    </div>

    <div class="form-group">
      <label for="password">密碼 <span class="required">*</span></label>
      <input
        type="password"
        id="password"
        name="password"
        class="form-control"
        placeholder="至少 6 個字元"
        autocomplete="new-password"
        required
        minlength="6"
      >
      <p class="form-hint">密碼至少 6 碼</p>
    </div>

    <div class="form-group">
      <label for="confirm_password">確認密碼 <span class="required">*</span></label>
      <input
        type="password"
        id="confirm_password"
        name="confirm_password"
        class="form-control"
        placeholder="再輸入一次密碼"
        autocomplete="new-password"
        required
      >
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-full">建立帳號</button>
    </div>

  </form>

  <div class="form-link">
    已有帳號？<a href="{{ url_for('login') }}">立即登入</a>
  </div>
</div>
{% endblock %}
