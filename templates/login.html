{% extends "base.html" %}
{% block title %}登入{% endblock %}

{% block content %}
<div class="form-card">
  <h1 class="form-title">歡迎回來 👋</h1>
  <p class="form-subtitle">登入你的帳號，繼續你的美食旅程</p>

  <form action="{{ url_for('login') }}" method="POST" novalidate>

    <div class="form-group">
      <label for="identifier">帳號 / Email <span class="required">*</span></label>
      <input
        type="text"
        id="identifier"
        name="identifier"
        class="form-control"
        placeholder="輸入使用者名稱或 Email"
        value="{{ identifier | default('') }}"
        autocomplete="username"
        required
      >
    </div>

    <div class="form-group">
      <label for="password">密碼 <span class="required">*</span></label>
      <input
        type="password"
        id="password"
        name="password"
        class="form-control"
        placeholder="輸入密碼"
        autocomplete="current-password"
        required
      >
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-full">登入</button>
    </div>

  </form>

  <div class="form-link">
    還沒有帳號？<a href="{{ url_for('sign_up') }}">立即免費註冊</a>
  </div>
</div>
{% endblock %}
