{% extends "base.html" %}
{% block title %}新增美食紀錄{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 620px;">
  <h1 class="form-title">新增美食紀錄 ✏️</h1>
  <p class="form-subtitle">記下這次的用餐體驗</p>

  <form action="{{ url_for('new_review') }}" method="POST" novalidate>

    <div class="form-group">
      <label for="restaurant_name">餐廳名稱 <span class="required">*</span></label>
      <input
        type="text"
        id="restaurant_name"
        name="restaurant_name"
        class="form-control"
        placeholder="輸入餐廳名稱，或從下方清單選擇"
        value="{{ form.restaurant_name if form else (request.args.get('restaurant', '')) }}"
        list="restaurant-list"
        autocomplete="off"
        required
      >
      {% if restaurant_names %}
        <datalist id="restaurant-list">
          {% for name in restaurant_names %}
            <option value="{{ name }}">
          {% endfor %}
        </datalist>
        <p class="form-hint">輸入文字可從 {{ restaurant_names | length }} 間台大餐廳中搜尋</p>
      {% else %}
        <datalist id="restaurant-list"></datalist>
      {% endif %}
    </div>

    <!-- 選擇菜色（選到餐廳後才顯示） -->
    <div id="menu-container" class="form-group" style="display:none;">
      <label for="menu_select">選擇菜色 <span class="form-hint" style="font-weight:400;">（選填，自動帶入售價）</span></label>
      <select id="menu_select" class="form-control">
        <option value="">-- 選擇菜色 --</option>
      </select>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="visit_date">用餐日期 <span class="required">*</span></label>
        <input
          type="date"
          id="visit_date"
          name="visit_date"
          class="form-control"
          value="{{ form.visit_date if form else '' }}"
          required
        >
      </div>

      <div class="form-group">
        <label for="meal_type">餐別</label>
        <select id="meal_type" name="meal_type" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for mt in meal_types %}
            <option value="{{ mt }}" {% if form and form.meal_type == mt %}selected{% endif %}>{{ mt }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="category">料理類別</label>
        <select id="category" name="category" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for cat in categories %}
            <option value="{{ cat }}" {% if form and form.category == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="rating">評分（1–5 顆星）</label>
        <select id="rating" name="rating" class="form-control">
          <option value="">-- 請選擇 --</option>
          {% for i in range(1, 6) %}
            <option value="{{ i }}" {% if form and form.rating == i|string %}selected{% endif %}>
              {{ '★' * i }}{{ '☆' * (5 - i) }} {{ i }} 星
            </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="price">消費金額（NT$）</label>
      <input
        type="number"
        id="price"
        name="price"
        class="form-control"
        placeholder="例：350（可留空）"
        min="0"
        step="1"
        value="{{ form.price if form else '' }}"
      >
    </div>

    <div class="form-group">
      <label for="address">地址</label>
      <input
        type="text"
        id="address"
        name="address"
        class="form-control"
        placeholder="例：台北市大安區羅斯福路四段 1 號（可留空）"
        value="{{ form.address if form else '' }}"
      >
      <p class="form-hint">填入地址後可在美食地圖中顯示位置</p>
    </div>

    <div class="form-group">
      <label for="comment">心得評論</label>
      <textarea
        id="comment"
        name="comment"
        class="form-control"
        placeholder="寫下你的用餐感受、推薦菜色、注意事項…"
        rows="4"
      >{{ form.comment if form else '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">儲存紀錄</button>
      <a href="{{ url_for('diary') }}" class="btn btn-secondary">取消</a>
    </div>

  </form>
</div>

<script>
(function () {
  const input   = document.getElementById('restaurant_name');
  const list    = document.getElementById('restaurant-list');
  const menuBox = document.getElementById('menu-container');
  const menuSel = document.getElementById('menu_select');
  const price   = document.getElementById('price');

  function loadMenu(name) {
    if (!name) { menuBox.style.display = 'none'; return; }
    fetch('/api/menu?restaurant=' + encodeURIComponent(name))
      .then(r => r.ok ? r.json() : [])
      .then(items => {
        if (!items.length) { menuBox.style.display = 'none'; return; }
        menuSel.innerHTML = '<option value="">-- 選擇菜色 --</option>';
        items.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.price != null ? item.price : '';
          opt.textContent = item.price != null
            ? item.item_name + '（NT$' + item.price + '）'
            : item.item_name;
          menuSel.appendChild(opt);
        });
        menuBox.style.display = 'block';
      })
      .catch(() => { menuBox.style.display = 'none'; });
  }

  function checkExact() {
    const opts = Array.from(list.options).map(o => o.value);
    if (opts.includes(input.value)) loadMenu(input.value);
    else menuBox.style.display = 'none';
  }

  input.addEventListener('change', checkExact);
  input.addEventListener('input',  checkExact);
  menuSel.addEventListener('change', function () {
    if (this.value !== '') price.value = this.value;
  });

  // 如果從餐廳頁帶入餐廳名，自動載入菜單
  if (input.value) loadMenu(input.value);
})();
</script>
{% endblock %}
